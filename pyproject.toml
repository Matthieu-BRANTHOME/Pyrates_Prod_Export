[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrates-export"
version = "0.1.0"
description = "Export Pyrates interaction traces from the production MySQL database to monthly Parquet files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMySQL>=1.1",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pyrates-export = "pyrates_export.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
